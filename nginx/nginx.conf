# Modified from /docker:nginx:/etc/nginx/nginx.conf
user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
    # multi_accept off;
}

http {
    ##
    # Basic Settings
    ##

    sendfile        on;
    # tcp_nopush    on;
    # tcp_nodeplay  on;

    keepalive_timeout  65;
    # keepalive_requests 100;

    # types_hash_max_size 1024;

    server_tokens off; # on

    # server_names_hash_bucket_size 64;
    # server_name_in_redirect off;

    client_max_body_size 128m; # 1m

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

	  ##
	  # Logging Settings
	  ##

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log main;

	  ##
	  # Gzip Settings
	  ##

    #gzip  off;

    ##
    # RealIP
    ##

    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;
    set_real_ip_from  10.1.0.0/16;

	  ##
	  # Virtual Host Configs
	  ##

    # Comment out inclusion of site conf, in preference over explicitly
    # defining bellow.
    # include /etc/nginx/conf.d/*.conf;

    # Modified from /docker:nginx:/etc/nginx/conf.d/default.conf
    server {
        listen       80;
        server_name  _;

        #charset koi8-r;
        #access_log  /var/log/nginx/host.access.log  main;

        location /s/swyt-web  {
            alias   /usr/share/nginx/html/;
            index  index.html index.htm;
            # The root index.html is served for page not found / 404 errors
            # which allows us to use pushState() based routing.
            # try_files $uri $uri/ /index.html;
        }

        # location /backend {
        #     proxy_pass https://kbw-cms.hbjt.net.cn/backend/;
        #     proxy_cookie_path / /backend;
        #     proxy_redirect default;
        #     rewrite ^/(.*) /$1 break;
        #     client_max_body_size 500m;
        # }

        #error_page  404              /404.html;

        # redirect server error pages to the static page /50x.html
        #
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }

        # proxy the PHP scripts to Apache listening on 127.0.0.1:80
        #
        #location ~ \.php$ {
        #    proxy_pass   http://127.0.0.1;
        #}

        # pass the PHP scripts to FastCGI server listening on 127.0.0.1:9000
        #
        #location ~ \.php$ {
        #    root           html;
        #    fastcgi_pass   127.0.0.1:9000;
        #    fastcgi_index  index.php;
        #    fastcgi_param  SCRIPT_FILENAME  /scripts$fastcgi_script_name;
        #    include        fastcgi_params;
        #}

        # deny access to .htaccess files, if Apache's document root
        # concurs with nginx's one
        #
        #location ~ /\.ht {
        #    deny  all;
        #}
    }
}
